<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Huzur Vakti</title>
  
  <!-- Web Sitesi Ekran Kaymasını Engelleme ve Mobil Uygulama Stilleri -->
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      position: fixed;
      width: 100%;
      height: 100%;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(180deg, #0f172a 0%, #1e293b 100%);
      color: #ffffff;
    }

    /* Sadece İçerik Alanı Kaydırılabilir */
    .app-container {
      display: flex;
      flex-direction: column;
      height: 100%;
      width: 100%;
    }

    .header {
      padding: 20px 15px 10px;
      text-align: center;
    }

    .main-content {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 10px 15px 80px;
      touch-action: pan-y;
    }

    /* Modern Şehir Seçim Kartı */
    .location-card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      border-radius: 18px;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 1px solid rgba(255, 255, 255, 0.15);
      margin-bottom: 20px;
      cursor: pointer;
    }

    /* Vakit Kartları */
    .times-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }

    .time-card {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 14px;
      padding: 15px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .time-card.active {
      background: rgba(234, 179, 8, 0.2);
      border-color: #eab308;
    }

    /* Pusula Alanı */
    .compass-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 25px 0;
    }

    .compass {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      border: 4px solid #eab308;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 20px rgba(234, 179, 8, 0.2);
    }

    .compass-needle {
      width: 6px;
      height: 140px;
      position: absolute;
      transition: transform 0.2s ease-out;
    }

    .compass-needle::before {
      content: '🕋';
      font-size: 20px;
      position: absolute;
      top: -12px;
      left: -8px;
    }

    .compass-needle::after {
      content: '';
      position: absolute;
      top: 15px;
      left: 0;
      width: 6px;
      height: 55px;
      background: #eab308;
      border-radius: 3px;
    }

    /* Alt Menü Modal (Bottom Sheet) */
    .city-modal {
      position: fixed;
      bottom: -100%;
      left: 0;
      width: 100%;
      height: 75vh;
      background: #1e293b;
      border-radius: 24px 24px 0 0;
      transition: bottom 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 1000;
      padding: 20px;
      box-shadow: 0 -10px 30px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
    }

    .city-modal.active {
      bottom: 0;
    }

    .search-box {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.1);
      background: #0f172a;
      color: white;
      font-size: 16px;
      margin: 15px 0;
      outline: none;
    }

    .city-list {
      flex: 1;
      overflow-y: auto;
    }

    .city-item {
      padding: 14px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      font-size: 16px;
    }

    .btn {
      background: #eab308;
      color: #0f172a;
      border: none;
      padding: 12px 20px;
      border-radius: 12px;
      font-weight: bold;
      width: 100%;
      margin-top: 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="header">
      <h2>Huzur Vakti</h2>
    </div>

    <div class="main-content">
      <!-- Modern Şehir Seçimi -->
      <div class="location-card" onclick="toggleCityModal(true)">
        <div>
          <span style="font-size: 12px; opacity: 0.6;">SEÇİLİ KONUM</span>
          <h3 id="cityName">İstanbul</h3>
        </div>
        <span style="color: #eab308;">📍 Değiştir</span>
      </div>

      <!-- İzin ve Test Butonu -->
      <button class="btn" onclick="enableNotificationsAndAudio()">🔔 Bildirim & Ses İzinlerini Aktif Et</button>

      <!-- Kıble Pusulası -->
      <div class="compass-container">
        <div class="compass">
          <div class="compass-needle" id="needle"></div>
        </div>
        <small style="margin-top: 10px; opacity: 0.7;">Pusulayı Kıbleye Göre Çevirin</small>
      </div>

      <!-- Vakitler Grid -->
      <div class="times-grid">
        <div class="time-card"><div>İmsak</div><strong id="imsak">05:12</strong></div>
        <div class="time-card"><div>Güneş</div><strong id="gunes">06:38</strong></div>
        <div class="time-card active"><div>Öğle</div><strong id="ogle">13:10</strong></div>
        <div class="time-card"><div>İkindi</div><strong id="ikindi">16:45</strong></div>
        <div class="time-card"><div>Akşam</div><strong id="aksam">19:32</strong></div>
        <div class="time-card"><div>Yatsı</div><strong id="yatsi">20:52</strong></div>
      </div>
    </div>
  </div>

  <!-- Modern Şehir Seçim Penceresi (Modal) -->
  <div class="city-modal" id="cityModal">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <h3>Şehir Seç</h3>
      <span onclick="toggleCityModal(false)" style="font-size: 24px; cursor: pointer;">✕</span>
    </div>
    <input type="text" class="search-box" id="citySearch" placeholder="Şehir adı yazın..." oninput="filterCities()">
    <div class="city-list" id="cityList"></div>
  </div>

  <script>
    const cities = ["Adana", "Adıyaman", "Afyonkarahisar", "Ağrı", "Amasya", "Ankara", "Antalya", "Artvin", "Aydın", "Balıkesir", "Bilecik", "Bingöl", "Bitlis", "Bolu", "Burdur", "Bursa", "Çanakkale", "Çankırı", "Çorum", "Denizli", "Diyarbakır", "Edirne", "Elazığ", "Erzincan", "Erzurum", "Eskişehir", "Gaziantep", "Giresun", "Gümüşhane", "Hakkari", "Hatay", "Isparta", "Mersin", "İstanbul", "İzmir", "Kars", "Kastamonu", "Kayseri", "Kırklareli", "Kırşehir", "Kocaeli", "Konya", "Kütahya", "Malatya", "Manisa", "Kahramanmaraş", "Mardin", "Muğla", "Muş", "Nevşehir", "Niğde", "Ordu", "Rize", "Sakarya", "Samsun", "Siirt", "Sinop", "Sivas", "Tekirdağ", "Tokat", "Trabzon", "Tunceli", "Şanlıurfa", "Uşak", "Van", "Yozgat", "Zonguldak", "Aksaray", "Bayburt", "Karaman", "Kırıkkale", "Batman", "Şırnak", "Bartın", "Ardahan", "Iğdır", "Yalova", "Karabük", "Kilis", "Osmaniye", "Düzce"];

    // Mekke Koordinatları
    const MECCA_LAT = 21.4225;
    const MECCA_LNG = 39.8262;

    // Şehir Seçim Modalı Yönetimi
    function toggleCityModal(show) {
      const modal = document.getElementById('cityModal');
      if (show) {
        modal.classList.add('active');
        renderCities(cities);
      } else {
        modal.classList.remove('active');
      }
    }

    function renderCities(list) {
      const cityListEl = document.getElementById('cityList');
      cityListEl.innerHTML = '';
      list.forEach(city => {
        const div = document.createElement('div');
        div.className = 'city-item';
        div.innerText = city;
        div.onclick = () => selectCity(city);
        cityListEl.appendChild(div);
      });
    }

    function filterCities() {
      const query = document.getElementById('citySearch').value.toLowerCase();
      const filtered = cities.filter(c => c.toLowerCase().includes(query));
      renderCities(filtered);
    }

    function selectCity(city) {
      document.getElementById('cityName').innerText = city;
      toggleCityModal(false);
      // Şehre göre vakit çekme mantığı buraya bağlanabilir
    }

    // Gerçek Pusula & Kıble Mantığı
    if (window.DeviceOrientationEvent) {
      window.addEventListener('deviceorientation', function(e) {
        let alpha = e.alpha || 0;
        if (e.webkitCompassHeading) alpha = e.webkitCompassHeading; // iOS desteği
        
        // Kıble Açısı
        let needle = document.getElementById('needle');
        if (needle) {
          needle.style.transform = `rotate(${136 - alpha}deg)`; // Türkiye ortalama kıble açısı referansı
        }
      }, true);
    }

    // Bildirim ve Arka Plan Ses İzinleri
    function enableNotificationsAndAudio() {
      if ("Notification" in window) {
        Notification.requestPermission().then(permission => {
          if (permission === "granted") {
            alert("Ezan vakti bildirimleri başarıyla aktif edildi!");
          } else {
            alert("Bildirim izni reddedildi.");
          }
        });
      }

      // Sessiz bir ses oynatarak mobil tarayıcı/webview ses engelini kaldırıyoruz
      let dummyAudio = new Audio('https://actions.google.com/sounds/v1/alarms/beep_short.ogg');
      dummyAudio.play().then(() => {
        alert("Ezan sesleri aktif edildi!");
      }).catch(() => {
        alert("Ses izni için ekrana dokunun.");
      });
    }
  </script>
</body>
</html>
