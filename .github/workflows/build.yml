name: Android APK Üretici

on:
  push:
    branches: [ "main", "master" ] # Kod hangi dala yüklendiğinde çalışacağını belirtir
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Tarayıcı üzerinden manuel olarak da başlatabilmenizi sağlar

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Adım: Depodaki kodları iş akışına çeker
    - name: Kodu Klonla
      uses: actions/checkout@v4

    # 2. Adım: Java (JDK 17) ortamını kurar
    - name: Java JDK 17 Kurulumu
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'
        cache: 'gradle'

    # 3. Adım: Gradle çalıştırma yetkisini verir
    - name: Gradle Yetkilendirmesi
      run: chmod +x ./gradlew

    # 4. Adım: APK dosyasını derler (Debug sürümü)
    - name: APK Derleme (Assemble Debug)
      run: ./gradlew assembleDebug

    # 5. Adım: Üretilen APK dosyasını GitHub paneline yükler (İndirilebilir hale getirir)
    - name: APK Dosyasını Çıktı Olarak Yükle
      uses: actions/artifacts/upload-artifact@v4
      with:
        name: android-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
