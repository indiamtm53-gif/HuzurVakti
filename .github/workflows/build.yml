name: Android APK Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v3

      - name: Node.js Kur
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Java & JDK Kur
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Android SDK Kur
        uses: android-actions/setup-android@v2

      - name: Bağımlılıkları Yükle
        run: npm ci || npm install

      - name: Uygulama İkonlarını Üret
        run: |
          npm install @capacitor/assets
          npx @capacitor/assets generate --android || true

      - name: Projeyi Derle (Build)
        run: npm run build || true

      - name: Capacitor Sync
        run: npx cap sync android || true

      - name: APK Derle (Gradle Build)
        run: |
          if [ -d "android" ]; then
            cd android
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "Android klasörü bulunamadı."
          fi

      - name: APK Dosyasını İndirilebilir Yap (Artifacts)
        uses: actions/upload-artifact@v3
        with:
          name: HuzurVakti-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
