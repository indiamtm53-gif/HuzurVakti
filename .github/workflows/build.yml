name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v3

      - name: Node.js Kur
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Java & JDK Kur
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Android SDK Kur
        uses: android-actions/setup-android@v2

      - name: Bağımlılıkları Yükle
        run: |
          npm install
          npm install -g @capacitor/cli @capacitor/assets

      - name: Web Uygulamasını Derle
        run: |
          npm run build || true

      - name: Assets ve Logo Kontrolü
        run: |
          mkdir -p assets
          if [ -f "logo.png" ]; then
            cp logo.png assets/icon-only.png 2>/dev/null || true
            cp logo.png assets/icon-foreground.png 2>/dev/null || true
            cp logo.png assets/icon-background.png 2>/dev/null || true
          fi

      - name: Android Platform Kontrol ve Ekleme
        run: |
          if [ ! -d "android" ]; then
            npm install @capacitor/android
            npx cap add android
          fi

      - name: İkonları Üret
        run: |
          npx @capacitor/assets generate --android || true

      - name: Capacitor Sync
        run: |
          npx cap sync android

      - name: APK Derle (Gradle)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: APK Dosyasını Yükle (Artifacts)
        uses: actions/upload-artifact@v3
        with:
          name: HuzurVakti-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
