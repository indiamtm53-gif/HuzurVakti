name: 🚀 Expo Auto APK Builder

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    name: 📱 Automatic Expo APK
    runs-on: ubuntu-latest

    steps:

      # ---------------------------------------------------------
      # 1. KODU AL
      # ---------------------------------------------------------
      - name: 📥 Checkout
        uses: actions/checkout@v4


      # ---------------------------------------------------------
      # 2. PACKAGE.JSON KONTROLÜ
      # ---------------------------------------------------------
      - name: 🔍 Detect Expo project
        id: detect
        shell: bash
        run: |
          set -e

          if [ ! -f package.json ]; then
            echo "❌ package.json bulunamadı."
            exit 1
          fi

          EXPO_VERSION=$(node -e "
            const p=require('./package.json');
            const v=p.dependencies?.expo || p.devDependencies?.expo || '';
            console.log(v);
          ")

          if [ -z "$EXPO_VERSION" ]; then
            echo "❌ Bu repository bir Expo projesi değil."
            echo "package.json içinde expo dependency bulunamadı."
            exit 1
          fi

          echo "✅ Expo dependency bulundu: $EXPO_VERSION"

          echo "expo_version=$EXPO_VERSION" >> "$GITHUB_OUTPUT"


      # ---------------------------------------------------------
      # 3. EXPO SDK VE NODE SÜRÜMÜNÜ OTOMATİK BELİRLE
      # ---------------------------------------------------------
      - name: 🧠 Select Node.js version
        id: node-version
        shell: bash
        run: |
          set -e

          echo "🔎 Node.js sürümü otomatik belirleniyor..."

          # Önce package.json içindeki engines.node kontrol edilir.
          ENGINE_NODE=$(node -e "
            const p=require('./package.json');
            console.log(p.engines?.node || '');
          ")

          if [ -n "$ENGINE_NODE" ]; then
            echo "📌 package.json engines.node bulundu: $ENGINE_NODE"

            # actions/setup-node için kullanılabilir.
            NODE_VERSION="$ENGINE_NODE"

          else

            # Expo paket sürümünü al
            EXPO_VERSION=$(node -e "
              const p=require('./package.json');
              console.log(p.dependencies?.expo || p.devDependencies?.expo || '');
            ")

            # ^54.0.0 / ~55.0.0 / 57.0.0 gibi ifadelerden
            # ana SDK numarasını çıkart.
            SDK_MAJOR=$(echo "$EXPO_VERSION" | grep -oE '[0-9]+' | head -1)

            echo "📦 Expo SDK: $SDK_MAJOR"

            case "$SDK_MAJOR" in

              57)
                NODE_VERSION="22.13.x"
                ;;

              56)
                NODE_VERSION="20.19.x"
                ;;

              55)
                NODE_VERSION="20.19.x"
                ;;

              54)
                NODE_VERSION="20.19.x"
                ;;

              53)
                NODE_VERSION="20.18.x"
                ;;

              52)
                NODE_VERSION="20.18.x"
                ;;

              *)
                echo "⚠️ Bu Expo SDK için sabit eşleştirme bulunamadı."
                echo "📌 Güncel LTS Node kullanılacak."

                NODE_VERSION="lts/*"
                ;;
            esac
          fi

          echo "🚀 Seçilen Node.js: $NODE_VERSION"

          echo "node_version=$NODE_VERSION" >> "$GITHUB_OUTPUT"


      # ---------------------------------------------------------
      # 4. NODE.JS KUR
      # ---------------------------------------------------------
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node-version.outputs.node_version }}


      # ---------------------------------------------------------
      # 5. NODE BİLGİLERİ
      # ---------------------------------------------------------
      - name: 📊 Node bilgilerini göster
        run: |
          echo "Node:"
          node --version

          echo "NPM:"
          npm --version


      # ---------------------------------------------------------
      # 6. PACKAGE MANAGER ALGILA
      # ---------------------------------------------------------
      - name: 📦 Detect package manager
        id: package-manager
        shell: bash
        run: |

          if [ -f "pnpm-lock.yaml" ]; then
            echo "manager=pnpm" >> "$GITHUB_OUTPUT"
            echo "📦 pnpm bulundu."

          elif [ -f "yarn.lock" ]; then
            echo "manager=yarn" >> "$GITHUB_OUTPUT"
            echo "📦 yarn bulundu."

          elif [ -f "bun.lockb" ] || [ -f "bun.lock" ]; then
            echo "manager=bun" >> "$GITHUB_OUTPUT"
            echo "📦 bun bulundu."

          else
            echo "manager=npm" >> "$GITHUB_OUTPUT"
            echo "📦 npm kullanılacak."
          fi


      # ---------------------------------------------------------
      # 7. PACKAGE MANAGER HAZIRLA
      # ---------------------------------------------------------
      - name: 🛠️ Enable package manager
        shell: bash
        run: |

          MANAGER="${{ steps.package-manager.outputs.manager }}"

          if [ "$MANAGER" = "pnpm" ]; then
            corepack enable
            corepack prepare pnpm@latest --activate

          elif [ "$MANAGER" = "yarn" ]; then
            corepack enable

          elif [ "$MANAGER" = "bun" ]; then
            curl -fsSL https://bun.sh/install | bash
            echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
          fi


      # ---------------------------------------------------------
      # 8. DEPENDENCIES
      # ---------------------------------------------------------
      - name: 📚 Install dependencies
        shell: bash
        run: |

          MANAGER="${{ steps.package-manager.outputs.manager }}"

          case "$MANAGER" in

            npm)
              npm install
              ;;

            pnpm)
              pnpm install --no-frozen-lockfile
              ;;

            yarn)
              yarn install
              ;;

            bun)
              bun install
              ;;

          esac


      # ---------------------------------------------------------
      # 9. EXPO KONTROLÜ
      # ---------------------------------------------------------
      - name: 🔎 Expo version
        run: |
          npx expo --version


      # ---------------------------------------------------------
      # 10. EXPO DOCTOR
      # ---------------------------------------------------------
      - name: 🩺 Expo Doctor
        run: |
          npx expo-doctor || true


      # ---------------------------------------------------------
      # 11. ANDROID NATIVE PROJESİNİ OLUŞTUR
      # ---------------------------------------------------------
      - name: ⚙️ Expo Prebuild
        run: |
          npx expo prebuild \
            --platform android \
            --non-interactive \
            --no-install


      # ---------------------------------------------------------
      # 12. JAVA 17
      # ---------------------------------------------------------
      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17


      # ---------------------------------------------------------
      # 13. ANDROID SDK
      # ---------------------------------------------------------
      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3


      # ---------------------------------------------------------
      # 14. GRADLE CACHE
      # ---------------------------------------------------------
      - name: ⚡ Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-


      # ---------------------------------------------------------
      # 15. APK BUILD
      # ---------------------------------------------------------
      - name: 🔨 Build Release APK
        working-directory: android
        shell: bash
        run: |

          chmod +x gradlew

          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace


      # ---------------------------------------------------------
      # 16. APK BUL
      # ---------------------------------------------------------
      - name: 🔎 Find APK
        id: apk
        shell: bash
        run: |

          APK=$(find android/app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "❌ APK oluşturulamadı."
            exit 1
          fi

          echo "✅ APK bulundu:"
          echo "$APK"

          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"


      # ---------------------------------------------------------
      # 17. APK'YI ARTIFACT OLARAK YÜKLE
      # ---------------------------------------------------------
      - name: 📤 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Expo-APK
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30
