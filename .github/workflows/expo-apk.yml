name: Expo Auto APK Builder

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  detect-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Projeyi indir
        uses: actions/checkout@v4

      - name: 🟢 Node.js kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 🔍 Expo projesini algıla
        shell: bash
        run: |
          if [ ! -f "package.json" ]; then
            echo "❌ package.json bulunamadı."
            exit 1
          fi

          if node -e "const p=require('./package.json'); process.exit(p.dependencies?.expo || p.devDependencies?.expo ? 0 : 1)"; then
            echo "EXPO_PROJECT=true" >> "$GITHUB_ENV"
            echo "✅ Expo projesi algılandı."
          else
            echo "❌ Bu repository bir Expo projesi değil."
            echo "Bu sistem yalnızca Expo projeleri için çalışıyor."
            exit 1
          fi

      - name: 📦 Paket yöneticisini algıla
        shell: bash
        run: |
          if [ -f "pnpm-lock.yaml" ]; then
            echo "PACKAGE_MANAGER=pnpm" >> "$GITHUB_ENV"
            corepack enable
            corepack prepare pnpm@latest --activate

          elif [ -f "yarn.lock" ]; then
            echo "PACKAGE_MANAGER=yarn" >> "$GITHUB_ENV"
            corepack enable

          elif [ -f "bun.lockb" ] || [ -f "bun.lock" ]; then
            echo "PACKAGE_MANAGER=bun" >> "$GITHUB_ENV"
            curl -fsSL https://bun.sh/install | bash
            echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

          else
            echo "PACKAGE_MANAGER=npm" >> "$GITHUB_ENV"
          fi

      - name: 📦 Bağımlılıkları yükle
        shell: bash
        run: |
          case "$PACKAGE_MANAGER" in
            pnpm)
              pnpm install --no-frozen-lockfile
              ;;

            yarn)
              yarn install
              ;;

            bun)
              bun install
              ;;

            npm)
              npm install
              ;;
          esac

      - name: 🔎 Expo CLI kontrolü
        run: |
          npx expo --version

      - name: 🩺 Expo proje kontrolü
        run: |
          npx expo-doctor || true

      - name: ⚙️ Android projesini oluştur
        run: |
          npx expo prebuild \
            --platform android \
            --non-interactive \
            --no-install

      - name: ☕ Java 17 kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 🤖 Android SDK kurulumu
        uses: android-actions/setup-android@v3

      - name: 🔨 APK oluştur
        working-directory: android
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: 📤 APK'yı GitHub'a yükle
        uses: actions/upload-artifact@v4
        with:
          name: Expo-APK
          path: |
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
