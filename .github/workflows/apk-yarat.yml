name: Android APK Uretici

on:
  push:
    branches: [ "main", "master" ] # main veya master branch'ine kod yuklendiginde calisir
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Manuel olarak da baslatabilmenizi saglar

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Depoyu Klonla
      uses: actions/checkout@v4

    - name: Java Ortamini Hazirla (JDK 17)
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu' # En kararli Java dagitimlarindan biri
        java-version: '17'   # Modern Android projelerinin cogu icin en uyumlu surum
        cache: 'gradle'      # Islemleri hizlandirmak icin Gradle'i onbellege alir

    - name: Gradle Calistirma İznini Ver
      run: chmod +x gradlew

    - name: Hata Ayiklama (Debug) APK'si Uret
      run: ./gradlew assembleDebug --stacktrace

    - name: Uretilen APK Dosyasini Yukle
      uses: actions/upload-artifact@v4
      with:
        name: Kararli-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
